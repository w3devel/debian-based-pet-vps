# systemd unit drop-in override for systemd-nspawn@web1.service
#
# Deploy to:
#   /etc/systemd/system/systemd-nspawn@web1.service.d/override.conf
#
# Apply with:
#   sudo systemctl daemon-reload
#   sudo systemctl restart systemd-nspawn@web1
#
# IMPORTANT: Introduce settings incrementally. After each change, verify that
# Apache inside the container starts cleanly:
#   journalctl -u systemd-nspawn@web1 -e --no-pager
#
# Settings are ordered from least to most likely to cause breakage.

[Service]

# ── Privilege escalation prevention ──────────────────────────────────────────
# Prevents any process in the container from gaining new privileges via
# setuid/setgid binaries or Linux capabilities.
NoNewPrivileges=yes

# ── Filesystem isolation ──────────────────────────────────────────────────────
# Mount /usr, /boot, /etc read-only on the host namespace.
ProtectSystem=strict

# Block access to /home, /root, /run/user on the host.
ProtectHome=yes

# Give the container a private /tmp and /var/tmp (not shared with host).
PrivateTmp=yes

# ── Device isolation ──────────────────────────────────────────────────────────
# Restrict access to block and character devices.
PrivateDevices=yes
DevicePolicy=closed

# ── Memory protection ─────────────────────────────────────────────────────────
# Deny creation of memory mappings that are both writable and executable.
# Helps mitigate JIT spraying and some ROP attacks.
# NOTE: Disable this if you run PHP with OPcache or other JIT-compiled workloads.
MemoryDenyWriteExecute=yes

# ── Identity hardening ────────────────────────────────────────────────────────
# Block setuid/setgid file creation.
RestrictSUIDSGID=yes

# Prevent changes to the ABI/execution domain.
LockPersonality=yes

# ── Kernel protection ─────────────────────────────────────────────────────────
# Make /proc/sys and /sys read-only.
ProtectKernelTunables=yes

# Block module loading/unloading syscalls.
ProtectKernelModules=yes

# Make the cgroup hierarchy read-only inside the container.
ProtectControlGroups=yes

# ── Namespace restrictions ────────────────────────────────────────────────────
# Prevent the container from creating new namespaces (prevents escape attempts).
RestrictNamespaces=yes

# Prevent processes from acquiring real-time scheduling priority.
RestrictRealtime=yes

# Limit socket address families to only what Apache/networkd need.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

# ── User namespace (strongest isolation — enable after confirming stability) ──
# Maps root inside the container to an unprivileged UID on the host.
# This is the most powerful isolation knob and the most likely to cause issues.
#
# IMPORTANT WARNINGS before enabling:
#   - File ownership inside the container rootfs must be consistent with the
#     mapped UID range; mismatches will cause permission errors on Apache logs,
#     socket files, and package management.
#   - Some capabilities (CAP_NET_BIND_SERVICE, CAP_DAC_READ_SEARCH) behave
#     differently inside a user namespace and may silently break modules.
#   - Volume bind-mounts from the host may become inaccessible if the host path
#     is owned by UID 0 and the container maps UID 0 to a high UID.
#   - Test thoroughly in a non-production environment before enabling here.
#     After enabling, verify with: journalctl -u systemd-nspawn@web1 -e
#
# PrivateUsers=yes

# ── Optional resource controls ────────────────────────────────────────────────
# Uncomment and tune as needed:
# MemoryMax=1G
# CPUQuota=50%
# TasksMax=256
