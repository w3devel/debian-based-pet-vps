# systemd unit drop-in override for systemd-nspawn@web3.service
#
# Deploy to:
#   /etc/systemd/system/systemd-nspawn@web3.service.d/override.conf
#
# Apply with:
#   sudo systemctl daemon-reload
#   sudo systemctl restart systemd-nspawn@web3
#
# IMPORTANT: Introduce settings incrementally. After each change, verify that
# Caddy inside the container starts cleanly:
#   journalctl -u systemd-nspawn@web3 -e --no-pager
#
# Settings are ordered from least to most likely to cause breakage.

[Service]

# ── Privilege escalation prevention ──────────────────────────────────────────
NoNewPrivileges=yes

# ── Filesystem isolation ──────────────────────────────────────────────────────
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes

# ── Device isolation ──────────────────────────────────────────────────────────
PrivateDevices=yes
DevicePolicy=closed

# ── Memory protection ─────────────────────────────────────────────────────────
# Caddy is compiled Go — no JIT, so this is safe to enable.
# NOTE: Disable if you run workloads inside the container that use JIT.
MemoryDenyWriteExecute=yes

# ── Identity hardening ────────────────────────────────────────────────────────
RestrictSUIDSGID=yes
LockPersonality=yes

# ── Kernel protection ─────────────────────────────────────────────────────────
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes

# ── Namespace restrictions ────────────────────────────────────────────────────
RestrictNamespaces=yes
RestrictRealtime=yes

# Caddy needs TCP/IP to reach the upstream; DNS uses UDP.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

# ── User namespace (strongest isolation — enable after confirming stability) ──
# PrivateUsers=yes

# ── Optional resource controls ────────────────────────────────────────────────
# Uncomment and tune as needed:
# MemoryMax=512M
# CPUQuota=25%
# TasksMax=128
