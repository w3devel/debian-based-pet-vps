# /etc/apache2/sites-available/<YOUR_DOMAIN>.conf  (inside systemd-nspawn container)
#
# Example virtual host for a single site.
# Duplicate and adapt for each additional domain.
#
# Replace <CONTAINER_IP> and <YOUR_DOMAIN> before deploying.
#
# TLS is terminated by Caddy on the host — this vhost speaks plain HTTP only.
#
# NOTE: Server-wide settings (ServerTokens, ServerSignature) belong in
# apache/conf-available/security.conf, not inside VirtualHost blocks.

<VirtualHost <CONTAINER_IP>:8080>
    ServerName  <YOUR_DOMAIN>
    ServerAlias <YOUR_WWW_DOMAIN>

    DocumentRoot /var/www/<YOUR_DOMAIN>/public

    # Security: default deny, then selectively allow the document root
    <Directory />
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/<YOUR_DOMAIN>/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Trust X-Forwarded-Proto set by Caddy (adjust if you use a different header)
    # Requires mod_remoteip
    RemoteIPHeader X-Real-IP

    # Logging
    ErrorLog  ${APACHE_LOG_DIR}/<YOUR_DOMAIN>-error.log
    CustomLog ${APACHE_LOG_DIR}/<YOUR_DOMAIN>-access.log combined
</VirtualHost>
