# /etc/apache2/sites-available/000-default.conf  (inside systemd-nspawn container)
#
# Default-deny virtual host.
# Catches any request that does not match a named VirtualHost.
# Returns 403 Forbidden and logs the attempt.
#
# Security rationale:
#   Apache processes every request through the first matching VirtualHost when
#   the Host header doesn't match a configured site.  By making the catch-all
#   return 403 instead of silently serving a real site, we prevent host-header
#   attacks and IP-direct requests from reaching application content.
#
# NOTE: Server-wide settings (ServerTokens, ServerSignature) belong in
# apache/conf-available/security.conf, not inside VirtualHost blocks.

<VirtualHost <CONTAINER_IP>:8080>
    ServerName _default_

    # Deny everything — no content is served from this vhost
    <Location />
        Require all denied
    </Location>

    # Minimal logging — helps identify scanners/probes
    ErrorLog  ${APACHE_LOG_DIR}/default-error.log
    CustomLog ${APACHE_LOG_DIR}/default-access.log combined
</VirtualHost>
