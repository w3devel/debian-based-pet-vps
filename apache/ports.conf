# /etc/apache2/ports.conf  (inside systemd-nspawn container)
#
# Bind Apache ONLY to the container's private veth IP address.
# This ensures Apache is never reachable from the public internet — all
# requests must flow through Varnish → Caddy on the host.
#
# Replace <CONTAINER_IP> with the actual container IP (e.g. 10.200.1.2).

Listen <CONTAINER_IP>:8080

# SSL module — only needed if you terminate TLS inside the container.
# In this stack TLS is terminated by Caddy on the host; leave this disabled.
# <IfModule ssl_module>
#     Listen <CONTAINER_IP>:8443
# </IfModule>
# <IfModule mod_gnutls.c>
#     Listen <CONTAINER_IP>:8443
# </IfModule>
