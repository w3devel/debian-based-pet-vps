# /etc/apache2/conf-available/security.conf  (inside systemd-nspawn container)
#
# Server-wide Apache security settings.
# These directives are global and cannot be placed inside VirtualHost blocks.
#
# Deploy to: /etc/apache2/conf-available/security.conf  (in container)
# Enable with:
#   sudo a2enconf security
#   sudo systemctl reload apache2
#
# NOTE: Debian ships its own /etc/apache2/conf-available/security.conf.
# Review and merge these settings with the Debian-provided file rather than
# overwriting it, to avoid losing distribution defaults.

# Do not advertise the Apache version number in error pages or headers.
ServerTokens Prod

# Do not include the server signature in server-generated pages (error pages).
ServerSignature Off

# Disable ETags — they can leak inode numbers on some configurations.
FileETag None

# Prevent MIME-type sniffing in browsers.
Header always set X-Content-Type-Options "nosniff"

# Basic clickjacking protection.
Header always set X-Frame-Options "SAMEORIGIN"

# Restrict the Referrer header to same-origin.
Header always set Referrer-Policy "strict-origin-when-cross-origin"
