#!/usr/sbin/nft -f
#
# /etc/nftables.conf
#
# Host firewall for the w3dev.tech VPS stack.
# Allows only: SSH (22), HTTP (80), HTTPS (443)
# Drops all other inbound traffic.
#
# This ruleset covers IPv4 and IPv6 in a single inet table.
#
# Apply immediately:  sudo nft -f /etc/nftables.conf
# Enable at boot:     sudo systemctl enable --now nftables

flush ruleset

table inet filter {

    # ── Inbound traffic ───────────────────────────────────────────────────────
    chain input {
        type filter hook input priority filter; policy drop;

        # Allow established and related connections
        ct state established,related accept

        # Allow loopback (required for many services including Varnish ↔ Caddy)
        iif lo accept

        # Allow ICMP / ICMPv6 (ping, path MTU discovery, neighbour discovery)
        ip  protocol icmp   accept
        ip6 nexthdr  icmpv6 accept

        # ── Public services ───────────────────────────────────────────────────
        # SSH — restrict to a specific source IP for extra protection (optional)
        # To restrict: replace the line below with:
        #   ip saddr <ADMIN_SOURCE_IP> tcp dport 22 accept
        tcp dport 22  accept

        # HTTP (Caddy handles the www→HTTPS redirect; must be open)
        tcp dport 80  accept

        # HTTPS
        tcp dport 443 accept

        # Log and drop everything else
        log prefix "[nft-drop] " level warn drop
    }

    # ── Forwarding ────────────────────────────────────────────────────────────
    # The host does NOT act as a router between the internet and the container.
    # All container traffic flows through Varnish (host process), not forwarded.
    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    # ── Outbound traffic ──────────────────────────────────────────────────────
    # Allow all outbound — restrict further if needed (e.g. apt, DNS, NTP only)
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
