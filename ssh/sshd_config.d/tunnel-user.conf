# /etc/ssh/sshd_config.d/tunnel-user.conf
#
# Hardened OpenSSH configuration for the w3dev.tech VPS stack.
#
# HOW TO DEPLOY:
#   1. Copy this file to /etc/ssh/sshd_config.d/tunnel-user.conf
#   2. Verify syntax:  sudo sshd -t
#   3. Reload:         sudo systemctl restart ssh
#
# DESIGN:
#   Global defaults disable all forwarding and require public-key authentication.
#   A Match block re-enables TCP forwarding for the dedicated "tunnel" user only.
#   Per-key restrictions in authorized_keys further limit what each key can do
#   (see ssh/authorized_keys.example).
#
# PREREQUISITE:
#   Create the tunnel user before deploying this file:
#     sudo adduser --disabled-password --gecos "" tunnel
#     sudo install -d -m 0700 -o tunnel -g tunnel /home/tunnel/.ssh
#     sudo install -m 0600 -o tunnel -g tunnel /dev/null /home/tunnel/.ssh/authorized_keys

# ── Global hardening ──────────────────────────────────────────────────────────

Protocol 2
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitRootLogin no

PubkeyAuthentication yes

# Disable all forwarding globally — only the Match block below re-enables TCP
# forwarding for the tunnel user.
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
PermitTunnel no
AllowTcpForwarding no
GatewayPorts no
PermitOpen none

# Connection hardening
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 20
MaxAuthTries 3
MaxSessions 10

# ── Match block: tunnel user ──────────────────────────────────────────────────
# Only the "tunnel" OS user gets TCP forwarding.
# The actual targets are further restricted in authorized_keys via permitopen=.

Match User tunnel
    AllowTcpForwarding yes
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    GatewayPorts no
    # PermitOpen is enforced per-key in authorized_keys (see authorized_keys.example)
    # but you can set a global limit here as a belt-and-suspenders measure:
    # PermitOpen <CONTAINER_IP>:8080
